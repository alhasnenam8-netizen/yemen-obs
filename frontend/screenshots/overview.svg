<?xml version="1.0" encoding="utf-8"?>
<!-- placeholder overview screenshot 1200x700 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#57a6ff"/>
      <stop offset="1" stop-color="#7ce3c1"/>
    </linearGradient>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="700" fill="#0f1726"/>
  <g transform="translate(60,40)">
    <rect width="1080" height="620" rx="18" fill="url(#g1)" opacity="0.08" />
    <rect x="8" y="8" width="1064" height="604" rx="12" fill="#07101a" opacity="0.8" stroke="#0b1220"/>
    <!-- header -->
    <rect x="28" y="28" width="380" height="34" rx="8" fill="#0f1726" stroke="#123047"/>
    <!-- search -->
    <rect x="28" y="76" width="640" height="48" rx="10" fill="#0b1220" stroke="#123047"/>
    <!-- cards grid -->
    <g fill="#081019" stroke="#123047" transform="translate(28,140)">
      <rect x="0" y="0" width="320" height="160" rx="12"/>
      <rect x="340" y="0" width="320" height="160" rx="12"/>
      <rect x="680" y="0" width="320" height="160" rx="12"/>
      <rect x="0" y="180" width="320" height="160" rx="12"/>
      <rect x="340" y="180" width="320" height="160" rx="12"/>
      <rect x="680" y="180" width="320" height="160" rx="12"/>
    </g>

    <!-- title text -->
    <text x="36" y="40" fill="#e6eef3" font-size="20" font-family="Cairo, sans-serif" font-weight="700">منشورات قناة Telegram — نظرة عامة</text>
    <text x="36" y="68" fill="#9aa6b2" font-size="13" font-family="Cairo, sans-serif">مثال لواجهة العرض المحسّنة (placeholder)</text>

    <!-- footer hint -->
    <text x="36" y="600" fill="#7ce3c1" font-size="12" font-family="Cairo, sans-serif">يمكن استبدال هذا الملف بلقطة حقيقية: frontend/screenshots/overview.png</text>
  </g>
</svg>
