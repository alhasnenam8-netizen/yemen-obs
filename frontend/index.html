<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>عرض منشورات قناة Telegram</title>

  <!-- Google Font (Arabic friendly) -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar" role="banner">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M2 12l20-8-4 20-6-6-3 3z"/></svg>
      <div class="title-wrap">
        <h1 class="title">منشورات قناة Telegram</h1>
        <p class="subtitle" id="totalInfo">جاري التحميل...</p>
      </div>
    </div>

    <div class="controls">
      <button id="themeToggle" class="icon-btn" aria-pressed="false" title="تبديل الوضع">
        <span class="icon" aria-hidden="true">🌙</span>
      </button>
      <button id="refreshBtn" class="btn" title="تحديث المنشورات">تحديث</button>
    </div>
  </header>

  <main class="container" role="main">
    <section class="panel search-panel" role="region" aria-label="بحث وفلترة">
      <div class="search-box">
        <label for="searchInput" class="visually-hidden">ابحث في المنشورات</label>
        <div class="search-field">
          <button id="clearSearch" class="clear-btn" title="مسح البحث" aria-label="مسح">✖</button>
          <input id="searchInput" type="search" placeholder="ابحث في المنشورات..." aria-label="بحث في المنشورات"/>
        </div>
      </div>

      <div class="filters">
        <label class="date-label">من
          <input id="fromDate" type="date" aria-label="من تاريخ" />
        </label>
        <label class="date-label">إلى
          <input id="toDate" type="date" aria-label="إلى تاريخ" />
        </label>
      </div>
    </section>

    <section id="statusBar" class="status" role="status" aria-live="polite">جارٍ التحميل...</section>

    <section id="posts" class="posts" aria-live="polite" aria-busy="true"></section>

    <div class="actions">
      <button id="loadMoreBtn" class="btn outline">تحميل المزيد</button>
    </div>
  </main>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="lightbox-backdrop" id="lightboxBackdrop"></div>
    <div class="lightbox-content" role="document">
      <button id="lightboxClose" class="icon-btn close" aria-label="إغلاق">✖</button>
      <div id="lightboxInner" class="lightbox-inner"></div>
      <div id="lightboxCaption" class="lightbox-caption"></div>
    </div>
  </div>

  <template id="postTemplate">
    <article class="post-card">
      <header class="post-head">
        <div class="post-date" title=""></div>
        <div class="post-actions">
          <a class="openTelegram btn small" target="_blank" rel="noopener noreferrer">افتح في تيليجرام</a>
        </div>
      </header>

      <div class="post-body">
        <p class="post-text"></p>
        <div class="post-media"></div>
      </div>

      <footer class="post-footer">
        <span class="muted">معرّف المنشور: <span class="post-id"></span></span>
      </footer>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
